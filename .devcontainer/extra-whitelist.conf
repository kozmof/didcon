# Extra network whitelist for the devcontainer.
# Add domains or CIDRs here, one per line. Comments start with #.
# After editing, rebuild the devcontainer to apply changes.
#
# To inspect the firewall inside the container:
#   cat /var/log/firewall.log
#   cat /var/log/firewall-status.txt
#
# Examples:
#   example.com
#   192.168.1.0/24

# safe-chain malware list
malware-list.aikido.dev
# Takumi Guard
npm.flatt.tech
golang.flatt.tech

# Zig toolchain and package downloads (build.zig.zon dependencies).
# There is no Takumi Guard equivalent for Zig — see the Zig notes in README.md.
ziglang.org

# Takumi Guard PyPI proxy — uv and pip resolution (.withBlender).
pypi.flatt.tech
# Artifact downloads. The guard vets at the resolution layer: it serves the
# simple index itself, but its /files/... URLs are 302 redirects to PyPI's CDN,
# so the bytes come from files.pythonhosted.org and it has to be reachable.
files.pythonhosted.org

# Deliberately absent: pypi.org. That is the *unvetted* index, and leaving it
# off is what keeps resolution going through the guard — a project that
# configures pypi.org directly fails closed rather than quietly installing
# something nothing screened. Add it only if the guard is being disabled on
# purpose.

# Not whitelisted on purpose: extensions.blender.org. Fetching Blender
# extensions at runtime should be a conscious edit, not a default.
