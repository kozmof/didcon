# pip system-level registry policy. Deployed to /etc/pip.conf, root-owned and
# world-readable (0444), containing no credentials.
#
# Separate from /etc/uv/uv.toml because the two tools share no configuration:
# uv does not read pip.conf or PIP_INDEX_URL, and pip does not read uv.toml.
# This file exists because Blender bundles its own CPython
# (/usr/local/blender/4.5/python/bin/python3.11) and addon projects do reach for
# its pip.
#
# See uv.toml in this directory for what Takumi Guard actually does.

[global]
index-url = https://pypi.flatt.tech/simple/
